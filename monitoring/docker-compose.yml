services:

  node-exporter:

    image: prom/node-exporter

    container_name: node-exporter

    ports:
      - "9100:9100"

    restart: always

  prometheus:

    image: prom/prometheus

    container_name: prometheus

    volumes:

      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    ports:

      - "9093:9090"

    depends_on:

      - node-exporter
      
  grafana:

    image: grafana/grafana

    container_name: grafana

    ports:

      - "3000:3000"

    depends_on:

      - prometheus
