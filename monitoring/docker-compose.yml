services:

  node-exporter:

    image: prom/node-exporter

    container_name: node-exporter

    ports:
      - "9100:9100"

    restart: always

    networks:
      - backend

  prometheus:

    image: prom/prometheus

    container_name: prometheus

    volumes:

      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    ports:

      - "9093:9090"

    depends_on:

      - node-exporter
    
    networks:
      - backend

  grafana:

    image: grafana/grafana

    container_name: grafana

    ports:

      - "3000:3000"

    depends_on:

      - prometheus

    networks:
      - backend

networks:

  backend:
    external: 
      name: docker_backend
