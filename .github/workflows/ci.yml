      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     key: ${{ secrets.SERVER_SSH_KEY }}
      #     script: |
      #       docker ps
      # - name: Health check
      #   run: |
      #     sleep 10
      #     curl http://your-server/health

permissions:
  contents: read
  packages: write
