services:

  app:
    build:
      context: ../app
      dockerfile: Dockerfile

    container_name: fastapi-app

    env_file:
      - ../app/.env

    expose:
      - "8000"

    networks:
      - backend


  postgres:

    image: postgres:16

    container_name: postgres-db

    environment:
      POSTGRES_DB: company
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend


  nginx:

    image: nginx:latest

    container_name: nginx-proxy

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - app

    networks:
      - backend


volumes:

  postgres_data:


networks:

  backend: