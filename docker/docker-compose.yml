services:
  app:
    build:
      context: ..
      dockerfile: app/Dockerfile

    container_name: fastapi-app

    env_file:
      - ../app/.env

    expose:
      - "8000"

    networks:
      - backend

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16

    container_name: postgres-db

    environment:
      POSTGRES_DB: company
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d company"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

  nginx:
    image: nginx:latest

    container_name: nginx-proxy

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - app

    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
